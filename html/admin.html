<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MOVEXA | Admin Dashboard</title>

    <link rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-inner">

        <a class="logo" href="index.html">

            <img src="../images/logo.png"
                alt="MOVEXA Logo">

            MOVEXA ADMIN

        </a>

        <nav class="nav-links">

            <a href="index.html">
                Website
            </a>

            <button
                class="btn btn-primary"
                onclick="logout()">

                Logout

            </button>

        </nav>

    </div>

</header>


<section class="page">

    <div class="container">

        <div class="page-title">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage users, bookings and
                support requests.
            </p>

        </div>


        <!-- STATISTICS -->

        <div class="dashboard-grid">


            <div class="stat">

                <small>
                    Total Users
                </small>

                <strong id="adminUsers">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    Total Bookings
                </small>

                <strong id="adminBookings">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    Active
                </small>

                <strong id="adminPending">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    Completed
                </small>

                <strong id="adminCompleted">
                    0
                </strong>

            </div>

        </div>


        <!-- BOOKING MANAGEMENT -->

        <div class="page-title"
            style="margin-top:40px">

            <h2>
                Booking Management
            </h2>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>User</th>

                        <th>From</th>

                        <th>To</th>

                        <th>Date</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="adminBookingRows">

                </tbody>

            </table>

        </div>


        <!-- SUPPORT -->

        <div class="page-title"
            style="margin-top:45px">

            <h2>
                Support Messages
            </h2>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>User</th>

                        <th>Issue</th>

                        <th>Message</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="supportRows">

                </tbody>

            </table>

        </div>

    </div>

</section>


<script src="../js/script.js"></script>

</body>
</html>
